name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release
        env:
          SUPABASE_URL: https://nwoseppmuztlmcvfhvge.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_q1fst_HduxFTvM-5RbqSxQ_koebJzpD
      - uses: actions/upload-artifact@v4
        with:
          name: maison-al-teeb-pos-apk
          path: build/app/outputs/flutter-apk/app-release.apk
