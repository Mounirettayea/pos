name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  SUPABASE_URL: https://nwoseppmuztlmcvfhvge.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_q1fst_HduxFTvM-5RbqSxQ_koebJzpD

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter pub get
        run: flutter pub get
      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --release --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" 2>&1 | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: maison-al-teeb-pos-build-log
          path: build.log
          retention-days: 7
      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: maison-al-teeb-pos-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
      - name: Build marker
        run: echo "POS APK build completed on main"
