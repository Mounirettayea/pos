name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  SUPABASE_URL: https://nwoseppmuztlmcvfhvge.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_q1fst_HduxFTvM-5RbqSxQ_koebJzpD

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: maison-al-teeb-pos-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Build marker
        run: echo "POS APK build triggered on main"
